# Source -> schema binding for extract-shaped GDC output.
#
# extract emits true GDC column names (no {entity}_ prefix), so most
# properties auto-bind via the camel / dotted-suffix resolver strategies.
# Only the columns that can't auto-resolve are listed as explicit aliases.
#
# File names are {NAME}.tsv (no dataset prefix); each dataset lives in its
# own data/raw/<dataset>/ directory.
#
# Entries with `key: null` are skipped at runtime (logged `! skip`).
# Run:
#   python -m src.standardise <dataset> --profile extract --report --values
# to see per-entry coverage, sample values, and which columns remain unused.
#
# DOCUMENTED GAPS (no GDC source column — no hardcoded literal substitutes):
#   Study:    conditionCategory, primarySite — stored as lists on the GDC project object;
#             not emittable as scalars. enrollmentCount — not returned by /cases.
#   Subject:  subjectType, species, ageUnit, geneticAncestry, developmentalStage,
#             strain, baselineBmi, bloodType, consentStatus, donorId
#   Sample:   sampleMaterial, collectionMethod, cellularComposition, cellLineName,
#             passageNumber, purity, suspensionType
#   PathologyDetail: cellularityPercent, inflammationScore, necrosisPercent,
#             tissueCondition, morphologyDescription, pathologyMethod, anatomicalSite
#             — not populated in TCGA pathology_detail records
#   Diagnosis: conditionGrade, sourceDataset — no GDC source column.
#             conditionId (FK mirror of the OF_CONDITION target) is deliberately
#             left unmapped: Condition.conditionId is minted as "ICD10:{code}"
#             (observation.DERIVED_KEYS) and a plain props/alias copy of
#             icd_10_code would carry the unqualified code, drifting from the
#             real Condition id. Traversal should use
#             (:Diagnosis)-[:OF_CONDITION]->(:Condition), not a mirror property.
#   Condition: conditionType, mondoId, synonyms, definition, ontologyVersion,
#             externalOntologyIds, sourceVocabulary — no GDC source column
#             (needs an external ICD-10<->MONDO mapping file; future work).

profile: extract

# GDC case == LifeSphere Subject; case_id feeds subjectId wherever it exists.
aliases:
  case_id: subjectId

nodes:
  # ── Program ───────────────────────────────────────────────────────────────
  # id = program name (project.program.name). Dedup collapses one row per case
  # to one per program.
  Program:
    file: program.tsv
    key: name
    dedup: true
    aliases:
      name: programName

  # ── Study (GDC project) ───────────────────────────────────────────────────
  # id = project_id (e.g. TCGA-COAD). Dedup collapses one row per case to one
  # per project. program_name is carried for the HAS_STUDY edge.
  # GAP: conditionCategory/primarySite are list fields on GDC project; enrollmentCount
  # is not returned via the /cases endpoint.
  Study:
    file: study.tsv
    key: project_id
    dedup: true
    props:
      studyAbbreviation: project_id
    aliases:
      project_name: studyName

  # ── Subject (GDC case) ────────────────────────────────────────────────────
  # id = case_id. Demographic sub-fields land with a "demographic." prefix
  # (flatten_scalars); the dotted-suffix strategy auto-resolves race, ethnicity,
  # sex_at_birth → sexAtBirth, submitter_id → submitterId, etc.
  # Only age_at_index can't auto-resolve (suffix camel = ageAtIndex ≠ ageAtIndexDays).
  Subject:
    file: subject.tsv
    key: case_id
    dedup: true
    aliases:
      demographic.age_at_index: ageAtIndexDays

  # ── Sample (aliquot grain) ────────────────────────────────────────────────
  # id = sample_id (GDC aliquot_id). gdc_sample_submitter_id = originating
  # TCGA barcode; tissue_type (Tumor/Normal class) maps to sampleClass.
  Sample:
    file: sample.tsv
    key: sample_id
    dedup: true
    aliases:
      gdc_sample_submitter_id: externalSampleId
      tissue_type: sampleClass

  # ── Diagnosis (subject-specific diagnosis event) ──────────────────────────
  # id = diagnosis_id. age_at_diagnosis is already in days. primary_diagnosis
  # feeds conditionSubtype (subject-specific subtype/tumour-subtype text).
  # conditionId is deliberately left unbound here — see the DOCUMENTED GAPS
  # note above; use the OF_CONDITION edge for the Diagnosis->Condition FK.
  # GAP: conditionGrade / sourceDataset have no GDC source column.
  Diagnosis:
    file: diagnosis.tsv
    key: diagnosis_id
    dedup: true
    props:
      conditionSubtype: primary_diagnosis
    aliases:
      age_at_diagnosis: ageAtDiagnosisDays
      ajcc_pathologic_stage: pathologicStage
      method_of_diagnosis: diagnosisMethod

  # ── Condition (stable ICD-10-keyed concept) ───────────────────────────────
  # One node per distinct icd_10_code, deduplicated across every diagnosis.
  # conditionName is seeded from primary_diagnosis (the closest GDC text label
  # to a formal condition name). conditionId is re-minted at standardise-time
  # as "ICD10:{icd_10_code}" (observation.DERIVED_KEYS) — the key: below is
  # documentation only, per docs/unique_ids.md §3a.
  # GAP: conditionType / mondoId / synonyms / definition / ontologyVersion /
  # externalOntologyIds / sourceVocabulary have no GDC source column.
  Condition:
    file: diagnosis.tsv
    key: icd_10_code
    dedup: true
    props:
      conditionName: primary_diagnosis

  # ── PathologyDetail ───────────────────────────────────────────────────────
  # id = pathology_detail_id. diagnosis_id auto-resolves via camel.
  # GAP: TCGA pathology_detail records do not carry cellularity, necrosis, or
  # inflammation scores; sampleId has no source column in this table.
  PathologyDetail:
    file: pathology_detail.tsv
    key: pathology_detail_id
    dedup: true

  # ── Survival (TCGA-CDR time-to-event endpoints) ──────────────────────────
  # id = survival_id, but re-minted in standardise from (case_id, survival_type)
  # via observation.DERIVED_KEYS — key: below is documentation only, per
  # docs/unique_ids.md. survivalType auto-resolves via camel (survival_type).
  # GAP: timeOrigin, eventType, lastFollowUpDays, censoringReason,
  # derivationMethod have no column in the cBioPortal TCGA-CDR extract
  # (src/extract/survival.py). eventOccurred carries the raw 1/0 status code
  # from that source, not a literal true/false string.
  Survival:
    file: survival.tsv
    key: survival_id
    dedup: true
    aliases:
      time_days: timeToEventDays
      event: eventOccurred

  # ── PhenotypeObservation (GDC exposure) ───────────────────────────────────
  # id = exposure_id. subjectId via global case_id alias; diagnosisId auto-
  # resolves via camel. TCGA-CHOL has no exposure records; file is empty.
  PhenotypeObservation:
    file: exposure.tsv
    key: exposure_id
    dedup: true

  # ── Intervention (GDC treatment) ─────────────────────────────────────────
  # id = treatment_id. sampleId auto-resolves via camel.
  # Columns that exist in some GDC datasets but not TCGA-CHOL are kept here
  # (harmless when absent); they will activate automatically for datasets
  # that carry them.
  Intervention:
    file: treatment.tsv
    key: treatment_id
    dedup: true
    aliases:
      therapeutic_agents: interventionName
      treatment_type: interventionType
      treatment_type_administered: interventionSubtype
      days_to_treatment_start: startDay
      days_to_treatment_end: endDay
      treatment_duration: durationDays
      treatment_intent_type: intentType
      treatment_dose: doseValue
      treatment_dose_units: doseUnit
      treatment_frequency: doseFrequency
      regimen_or_line_of_therapy: regimenName
      number_of_cycles: cycleNumber
      treatment_anatomic_sites: anatomicalSite
      # route_of_administration → routeOfAdministration auto-resolves via camel

edges:
  # program_name is carried on study.tsv for this join.
  HAS_STUDY:
    file: study.tsv
    pair: [Program, Study]
    start_key: program_name
    end_key: project_id

  # project.project_id is the dotted-key column emitted by flatten_scalars on
  # the subject's project dict; its value matches the Study node id.
  HAS_SUBJECT:
    file: subject.tsv
    pair: [Study, Subject]
    start_key: project.project_id
    end_key: case_id

  PROVIDED_SAMPLE:
    file: sample.tsv
    pair: [Subject, Sample]
    start_key: case_id
    end_key: sample_id

  HAS_DIAGNOSIS:
    file: diagnosis.tsv
    pair: [Subject, Diagnosis]
    start_key: case_id
    end_key: diagnosis_id
    props:
      isPrimaryDiagnosis: diagnosis_is_primary_disease

  OF_CONDITION:
    file: diagnosis.tsv
    pair: [Diagnosis, Condition]
    start_key: diagnosis_id
    end_key: icd_10_code

  HAS_PATHOLOGY:
    file: pathology_detail.tsv
    pair: [Diagnosis, PathologyDetail]
    start_key: diagnosis_id
    end_key: pathology_detail_id

  HAS_PHENOTYPE_OBSERVATION:
    file: exposure.tsv
    pair: [Diagnosis, PhenotypeObservation]
    start_key: diagnosis_id
    end_key: exposure_id

  HAS_SURVIVAL_RECORD:
    file: survival.tsv
    pair: [Subject, Survival]
    start_key: case_id
    end_key: survival_id

  UNDERWENT_INTERVENTION:
    file: treatment.tsv
    pair: [Sample, Intervention]
    start_key: sample_id
    end_key: treatment_id
