# Source -> schema binding for GDC-derived datasets (TCGA, etc.).
#
# STRUCTURE COMPLETE; SOURCE-COLUMN BINDINGS ARE DEFERRED. Per the project
# decision, the exact raw-column -> canonical-property mapping is reviewed against
# real extractor output later. Entries with `key: null` (or missing) are skipped
# by the standardise engine (logged `! skip`), so this file is safe to run as-is
# and filled in incrementally.
#
# Column binding (raw column -> schema property) is resolved per file, first
# match wins: node `props` override -> `aliases` table -> camelCase -> normalized
# -> dotted-suffix. Run `python -m src.standardise <dataset> --profile extract --report`
# to see, per entry, what matched (and how), what is unmatched, and which raw
# columns are still unused — the guided way to fill the TODOs below.
#
# Format
# ------
# aliases:               # OPTIONAL global raw_col -> canonicalProp (all entries)
#   <raw_col>: <prop>
#
# nodes:
#   <Label>:               # must exist in config/schema/nodes.yaml
#     file: <name>         # file under data/raw/<dataset>/
#     key: <raw_col>       # raw column holding the node id (null => skip)
#     strip_prefix: ""     # optional literal stripped from the id VALUE
#     strip_header_prefix: "diagnosis_"   # table-name prefix stripped from HEADERS
#                          # before matching (str or list); values still read from
#                          # the real column. e.g. diagnosis_tumor_grade -> tumorGrade
#     dedup: true          # collapse duplicate ids (keep first)
#     aliases:             # OPTIONAL node-scoped raw_col -> prop (overrides global)
#       <raw_col>: <prop>
#     props:               # canonicalProp: raw_col  (highest-priority override)
#       <prop>: <raw_col>
#
# edges:
#   <TYPE>:                # must exist in config/schema/edges.yaml
#     file: <name>
#     pair: [Src, Tgt]     # which schema pair (default = first pair)
#     start_key: <raw_col> # raw column for the start-node id (null => skip)
#     end_key: <raw_col>   # raw column for the end-node id
#     strip_start_prefix: ""
#     strip_end_prefix: ""
#     dedup: true
#     aliases: { <raw_col>: <prop> }
#     props:   { <prop>: <raw_col> }

profile: extract

# Global raw->canonical bindings (apply to every entry; take effect only where the
# canonical is an actual schema property of that node/edge). GDC's `case` == our
# Subject, so the `case_id` FK feeds `subjectId` wherever that property exists.
aliases:
  case_id: subjectId

nodes:
  # id = programName (no separate program_id in the GDC program summary).
  Program:
    file: TCGA.program.tsv
    key: program_name
    dedup: true
  # id = project_id (e.g. TCGA-BRCA); project_id also feeds studyAbbreviation.
  Study:
    file: TCGA.project.tsv
    key: project_id
    dedup: true
    props:
      studyAbbreviation: project_id
    aliases:
      project_name: studyName
      n_cases: enrollmentCount
  # id = case_id (GDC case). `demographic_` prefix stripped so demographic_race ->
  # race, demographic_ethnicity -> ethnicity, demographic_sex_at_birth -> sexAtBirth.
  Subject:
    file: TCGA.subject.tsv
    key: case_id
    strip_header_prefix: demographic_
    dedup: true
  # Grain is aliquot: id = sample_id (the per-aliquot UUID the treatment file also
  # references). gdc_sample_submitter_id is the TCGA barcode; sample_tissue_type is
  # the Tumor/Normal class. `sample_` prefix stripped for preservationMethod /
  # daysToCollection.
  Sample:
    file: TCGA.sample.tsv
    key: sample_id
    strip_header_prefix: sample_
    dedup: true
    aliases:
      gdc_sample_submitter_id: externalSampleId
      sample_tissue_type: sampleClass
  # id = diagnosis_id. `diagnosis_` prefix stripped (tumorGrade auto-resolves).
  # GDC age_at_diagnosis is already in days.
  Diagnosis:
    file: TCGA.diagnosis.tsv
    key: diagnosis_id
    strip_header_prefix: diagnosis_
    dedup: true
    aliases:
      diagnosis_age_at_diagnosis: ageAtDiagnosisDays
      diagnosis_ajcc_pathologic_stage: pathologicStage
      diagnosis_method_of_diagnosis: diagnosisMethod
      diagnosis_primary_diagnosis: diseaseSubtype
  # id = pathology_detail_id. `pathology_detail_` prefix stripped (diagnosisId and
  # necrosisPercent auto-resolve).
  PathologyDetail:
    file: TCGA.pathology_detail.tsv
    key: pathology_detail_id
    strip_header_prefix: pathology_detail_
    dedup: true
  # id = survival_id (e.g. <case>:OS). survivalType / lastFollowUpDays auto-resolve;
  # event -> eventOccurred, time_days -> timeToEventDays.
  Survival:
    file: TCGA.survival.tsv
    key: survival_id
    dedup: true
    aliases:
      event: eventOccurred
      time_days: timeToEventDays
  # Exposure records surface as PhenotypeObservation. id = exposure_id; diagnosisId
  # auto-resolves, subjectId via the global case_id alias.
  PhenotypeObservation:
    file: TCGA.exposure.tsv
    key: exposure_id
    dedup: true
  # id = treatment_id. sampleId auto-resolves; the rest are explicit GDC renames.
  # `_subtypeLabel` (Drug/Radiation/…) is left unbound — it needs a value crosswalk,
  # not a column rename, so a bare :Intervention is emitted for now.
  Intervention:
    file: TCGA.treatment.tsv
    key: treatment_id
    dedup: true
    aliases:
      treatment_therapeutic_agents: interventionName
      treatment_treatment_type: interventionType
      treatment_treatment_type_administered: interventionSubtype
      treatment_days_to_treatment_start: startDay
      treatment_days_to_treatment_end: endDay
      treatment_treatment_duration: durationDays
      treatment_treatment_intent_type: intentType
      treatment_treatment_dose: doseValue
      treatment_treatment_dose_units: doseUnit
      treatment_treatment_frequency: doseFrequency
      treatment_route_of_administration: routeOfAdministration
      treatment_regimen_or_line_of_therapy: regimenName
      treatment_number_of_cycles: cycleNumber
      treatment_number_of_fractions: numberOfFractions
      treatment_margin_status: marginStatus
      treatment_treatment_anatomic_sites: anatomicalSite

edges:
  HAS_STUDY:
    file: TCGA.project.tsv
    pair: [Program, Study]
    start_key: program_name
    end_key: project_id
  HAS_SUBJECT:
    file: TCGA.subject.tsv
    pair: [Study, Subject]
    start_key: project_id
    end_key: case_id
  PROVIDED_SAMPLE:
    file: TCGA.sample.tsv
    pair: [Subject, Sample]
    start_key: case_id
    end_key: sample_id
  HAS_DIAGNOSIS:
    file: TCGA.diagnosis.tsv
    pair: [Subject, Diagnosis]
    start_key: case_id
    end_key: diagnosis_id
    props:
      isPrimaryDiagnosis: diagnosis_diagnosis_is_primary_disease
  HAS_PATHOLOGY:
    file: TCGA.pathology_detail.tsv
    pair: [Diagnosis, PathologyDetail]
    start_key: diagnosis_id
    end_key: pathology_detail_id
  HAS_PHENOTYPE_OBSERVATION:
    file: TCGA.exposure.tsv
    pair: [Diagnosis, PhenotypeObservation]
    start_key: diagnosis_id
    end_key: exposure_id
  HAS_SURVIVAL_RECORD:
    file: TCGA.survival.tsv
    pair: [Subject, Survival]
    start_key: case_id
    end_key: survival_id
  UNDERWENT_INTERVENTION:
    file: TCGA.treatment.tsv
    pair: [Sample, Intervention]
    start_key: sample_id
    end_key: treatment_id
