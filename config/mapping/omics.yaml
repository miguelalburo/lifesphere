# Source -> schema binding for the omics layer.
#
# Sources:
#   expression_observation.tsv  — produced by src.extract.omics.expression.reshape()
#   methylation_observation.tsv — produced by src.extract.omics.methylation.reshape()
#
# Run with:
#   python -m src.standardise <dataset> --profile omics
#
# All non-id properties auto-bind via the camelCase resolver strategy.
# Assay and ASSAYED_BY are multi-source (expression + methylation) so the
# shared Assay dimension is populated from whichever files are present.
#
# NOTE: Gene, CpGSite, and Assay are dedup reference dimensions. Only the id
# column is populated here; full annotation comes from reference sources.
# Sample nodes are expected from the clinical pass; omics does not emit them.

profile: omics

nodes:
  ExpressionObservation:
    file: expression_observation.tsv
    key: expression_observation_id
    dedup: true

  Gene:
    file:
      - expression_observation.tsv
      - variation_observation.tsv
    key: gene_id
    dedup: true

  Assay:
    file:
      - expression_observation.tsv
      - methylation_observation.tsv
      - variation_observation.tsv
    key: assay_id
    dedup: true
    # Provenance properties. Present on traditional-reshape observation TSVs
    # (stamped from the profile's assay: sub-block); absent on GDC observation
    # TSVs, where the resolver simply leaves them empty — so this is additive and
    # harmless for the GDC path.
    props:
      platform: platform
      libraryStrategy: library_strategy
      referenceGenome: reference_genome
      geneAnnotationVersion: gene_annotation_version

  MethylationObservation:
    file: methylation_observation.tsv
    key: methylation_observation_id
    dedup: true

  CpGSite:
    file: methylation_observation.tsv
    key: cpg_id
    dedup: true

  VariantObservation:
    file: variation_observation.tsv
    key: variant_observation_id
    dedup: true

  Variant:
    file: variation_observation.tsv
    key: variant_id
    dedup: true

edges:
  HAS_EXPRESSION_OBSERVATION:
    file: expression_observation.tsv
    pair: [Sample, ExpressionObservation]
    start_key: sample_id
    end_key: expression_observation_id

  MEASURES_GENE:
    file: expression_observation.tsv
    pair: [ExpressionObservation, Gene]
    start_key: expression_observation_id
    end_key: gene_id

  ASSAYED_BY:
    file:
      - expression_observation.tsv
      - methylation_observation.tsv
      - variation_observation.tsv
    pair: [Sample, Assay]
    start_key: sample_id
    end_key: assay_id
    dedup: true

  HAS_METHYLATION_OBSERVATION:
    file: methylation_observation.tsv
    pair: [Sample, MethylationObservation]
    start_key: sample_id
    end_key: methylation_observation_id

  MEASURES_CPG:
    file: methylation_observation.tsv
    pair: [MethylationObservation, CpGSite]
    start_key: methylation_observation_id
    end_key: cpg_id

  HAS_VARIANT_OBSERVATION:
    file: variation_observation.tsv
    pair: [Sample, VariantObservation]
    start_key: sample_id
    end_key: variant_observation_id

  OBSERVED_VARIANT:
    file: variation_observation.tsv
    pair: [VariantObservation, Variant]
    start_key: variant_observation_id
    end_key: variant_id

  IS_WITHIN_GENE:
    file: variation_observation.tsv
    pair: [Variant, Gene]
    start_key: variant_id
    end_key: gene_id
    dedup: true
