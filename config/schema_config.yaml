# BioCypher schema — LifeSphere KG
#
# Custom lightweight ontology: our own labels, Biolink used only as a structural
# root (`entity` for nodes, `association` for edges) with no semantic commitment.
# The model this encodes is documented in docs/dev_guides/kg_data_model.md.
#
# Node/edge content properties are intentionally NOT filtered here: every column the
# standardiser emits (prefix-stripped) passes through to the graph. Key properties
# are noted in comments per entry. `preferred_id` names the id column the adapter
# supplies; `input_label` is the label the adapter tags each element with.

# ─────────────────────────────── Nodes ───────────────────────────────

program:
  represented_as: node
  is_a: entity
  preferred_id: program_name
  input_label: Program

project:
  represented_as: node
  is_a: entity
  preferred_id: project_id
  input_label: Project
  # props: project_name, disease_type, primary_site, program_name

subject:                                # standardised rename of GDC `case`
  represented_as: node
  is_a: entity
  preferred_id: case_id
  input_label: Subject
  # props: submitter_id, disease_type, primary_site + folded demographic_*
  #        (sex_at_birth, race, ethnicity, vital_status, age_at_index, ...)

diagnosis:
  represented_as: node
  is_a: entity
  preferred_id: diagnosis_id
  input_label: Diagnosis
  # props: primary_diagnosis, ajcc_pathologic_stage, tumor_grade, morphology, ...

treatment:
  represented_as: node
  is_a: entity
  preferred_id: treatment_id
  input_label: Treatment
  # props: treatment_type, therapeutic_agents, treatment_intent_type, treatment_outcome

pathology detail:
  represented_as: node
  is_a: entity
  preferred_id: pathology_detail_id
  input_label: PathologyDetail

follow up:
  represented_as: node
  is_a: entity
  preferred_id: follow_up_id
  input_label: FollowUp
  # props: days_to_follow_up, disease_response, progression_or_recurrence, ...

molecular test:
  represented_as: node
  is_a: entity
  preferred_id: molecular_test_id
  input_label: MolecularTest
  # props: gene_symbol, molecular_analysis_method, test_result, variant_type (ER/PR/HER2)

exposure:
  represented_as: node
  is_a: entity
  preferred_id: exposure_id
  input_label: Exposure

family history:
  represented_as: node
  is_a: entity
  preferred_id: family_history_id
  input_label: FamilyHistory

sample:
  represented_as: node
  is_a: entity
  preferred_id: sample_id
  input_label: Sample
  # props: sample_type, tissue_type, tumor_descriptor, preservation_method, days_to_collection

experimental group:                     # coarse control|treatment arm, derived from sample_type
  represented_as: node
  is_a: entity
  preferred_id: group_id
  input_label: ExperimentalGroup
  # props: group_label

# ─────────────────────────────── Edges ───────────────────────────────
# Direction parent -> child. source/target reference the node classes above.

program to project:
  represented_as: edge
  is_a: association
  input_label: HAS_PROJECT
  source: program
  target: project

project to subject:
  represented_as: edge
  is_a: association
  input_label: ENROLLS
  source: project
  target: subject

subject to diagnosis:
  represented_as: edge
  is_a: association
  input_label: HAS_DIAGNOSIS
  source: subject
  target: diagnosis

diagnosis to treatment:
  represented_as: edge
  is_a: association
  input_label: HAS_TREATMENT
  source: diagnosis
  target: treatment

diagnosis to pathology:
  represented_as: edge
  is_a: association
  input_label: HAS_PATHOLOGY
  source: diagnosis
  target: pathology detail

subject to follow up:
  represented_as: edge
  is_a: association
  input_label: HAS_FOLLOWUP
  source: subject
  target: follow up

# parent is Diagnosis OR FollowUp, selected by molecular_test.parent_entity
has molecular test:
  represented_as: edge
  is_a: association
  input_label: HAS_MOLECULAR_TEST
  source: [diagnosis, follow up]
  target: molecular test

subject to exposure:
  represented_as: edge
  is_a: association
  input_label: HAS_EXPOSURE
  source: subject
  target: exposure

subject to family history:
  represented_as: edge
  is_a: association
  input_label: HAS_FAMILY_HISTORY
  source: subject
  target: family history

subject to sample:
  represented_as: edge
  is_a: association
  input_label: HAS_SAMPLE
  source: subject
  target: sample

sample to experimental group:
  represented_as: edge
  is_a: association
  input_label: IN_GROUP
  source: sample
  target: experimental group

# ───────────────────────── Omics layer ─────────────────────────
# Measurements are REIFIED into per-assay observation nodes rather than stored on
# valued edges: (Sample)-[:HAS_EXPRESSION]->(Expression{tpm,...})-[:OF_GENE]->(Gene).
# Feature nodes (Gene, CpGSite, Variant, Protein, Pathway) are shared reference
# dimensions, deduplicated and reused across all samples. See
# docs/dev_guides/kg_data_model.md#omics-layer.

# ── Feature nodes (shared, deduplicated reference dimension) ──

gene:
  represented_as: node
  is_a: entity
  preferred_id: ensembl
  input_label: Gene
  # props: gene_symbol, biotype, chromosome

cpg site:
  represented_as: node
  is_a: entity
  preferred_id: cpg
  input_label: CpGSite
  # props: chromosome, position, gene_symbol

variant:
  represented_as: node
  is_a: entity
  preferred_id: variant_id
  input_label: Variant
  # props: chromosome, position, ref, alt, hgvsp, gene_ensembl

protein:
  represented_as: node
  is_a: entity
  preferred_id: uniprot
  input_label: Protein
  # props: protein_name, gene_symbol

pathway:
  represented_as: node
  is_a: entity
  preferred_id: pathway_id
  input_label: Pathway
  # props: pathway_name, source

# ── Observation nodes (one per sample × feature measurement) ──

expression:
  represented_as: node
  is_a: entity
  preferred_id: expression_id
  input_label: Expression
  # props: tpm, fpkm, aliquot_id, file_id

methylation:
  represented_as: node
  is_a: entity
  preferred_id: methylation_id
  input_label: Methylation
  # props: beta_value, aliquot_id, file_id

variant call:
  represented_as: node
  is_a: entity
  preferred_id: variant_call_id
  input_label: VariantCall
  # props: vaf, consequence, impact, aliquot_id, file_id

protein expression:
  represented_as: node
  is_a: entity
  preferred_id: protein_expression_id
  input_label: ProteinExpression
  # props: value, aliquot_id, file_id

# ── Omics edges (all plain: source_id, target_id) ──

sample to expression:
  represented_as: edge
  is_a: association
  input_label: HAS_EXPRESSION
  source: sample
  target: expression

expression to gene:
  represented_as: edge
  is_a: association
  input_label: OF_GENE
  source: expression
  target: gene

sample to methylation:
  represented_as: edge
  is_a: association
  input_label: HAS_METHYLATION
  source: sample
  target: methylation

methylation to cpg:
  represented_as: edge
  is_a: association
  input_label: AT_CPG
  source: methylation
  target: cpg site

sample to variant call:
  represented_as: edge
  is_a: association
  input_label: HAS_VARIANT_CALL
  source: sample
  target: variant call

variant call to variant:
  represented_as: edge
  is_a: association
  input_label: OF_VARIANT
  source: variant call
  target: variant

sample to protein expression:
  represented_as: edge
  is_a: association
  input_label: HAS_PROTEIN_EXPRESSION
  source: sample
  target: protein expression

protein expression to protein:
  represented_as: edge
  is_a: association
  input_label: OF_PROTEIN
  source: protein expression
  target: protein

# ── Static biology (Omnipath-shaped annotations) ──

variant to gene:
  represented_as: edge
  is_a: association
  input_label: VARIANT_IN_GENE
  source: variant
  target: gene

gene to pathway:
  represented_as: edge
  is_a: association
  input_label: IN_PATHWAY
  source: gene
  target: pathway

gene to protein:
  represented_as: edge
  is_a: association
  input_label: ENCODES
  source: gene
  target: protein

# ─────────────────── Single-cell & spatial layer ───────────────────
# A single-cell / spatial run adds an observational unit BELOW the sample: the
# dense cell x feature matrix stays external (matrix_uri on Assay); the graph holds
# the assay, per-cell annotations, spatial topology, and tractable aggregates
# (pseudobulk per sample x cell type, cell-set composition). See
# docs/dev_guides/kg_data_model.md. Inert until src/extract/*_reshape.py emits the
# assay/cell/cell_set/cell_type/cell_state/tissue_region/pseudobulk TSVs.

# ── Assay + observational units ──

assay:
  represented_as: node
  is_a: entity
  preferred_id: assay_id
  input_label: Assay
  # props: modality, platform, chemistry, n_cells, matrix_uri, pipeline_version

cell:
  represented_as: node
  is_a: entity
  preferred_id: cell_id
  input_label: Cell
  # props: x, y (spatial), n_genes, total_counts, pct_mito

# CellSet: a reproducible group of cells (cluster / cell-type population) — the
# scalable single-cell unit (NO per-cell nodes for dissociated scRNA). Per-cell
# `Cell` nodes above are kept for SPATIAL assays, where x,y + ADJACENT_TO matter.
cell set:
  represented_as: node
  is_a: entity
  preferred_id: cell_set_id
  input_label: CellSet
  # props: n_cells, grouping_basis, method, resolution

# ── Shared reference dimensions (deduplicated) ──

cell type:
  represented_as: node
  is_a: entity
  preferred_id: cell_type_id            # Cell Ontology CL:####
  input_label: CellType
  # props: cell_type_name

# context-specific state (Exhausted, Hypoxic); separate node — never a CellType prop
cell state:
  represented_as: node
  is_a: entity
  preferred_id: cell_state_id
  input_label: CellState
  # props: cell_state_name

tissue region:
  represented_as: node
  is_a: entity
  preferred_id: region_id               # UBERON or per-assay niche id
  input_label: TissueRegion
  # props: region_name

# ── Aggregate observation nodes (tractable grain) ──

pseudobulk expression:
  represented_as: node
  is_a: entity
  preferred_id: pseudobulk_id           # {sample_id}:{cell_type_id}:{gene_ensembl}
  input_label: PseudobulkExpression
  # props: tpm, mean_expr, pct_expressing

# ── Single-cell & spatial edges (all plain: source_id, target_id) ──

sample to assay:
  represented_as: edge
  is_a: association
  input_label: HAS_ASSAY
  source: sample
  target: assay

assay to cell:
  represented_as: edge
  is_a: association
  input_label: HAS_CELL
  source: assay
  target: cell

cell to cell type:
  represented_as: edge
  is_a: association
  input_label: IS_CELL_TYPE
  source: cell
  target: cell type

cell to tissue region:
  represented_as: edge
  is_a: association
  input_label: IN_REGION
  source: cell
  target: tissue region

# spatial neighbourhood (cell <-> cell); distance is not carried (plain edge)
cell to cell:
  represented_as: edge
  is_a: association
  input_label: ADJACENT_TO
  source: cell
  target: cell

sample to pseudobulk:
  represented_as: edge
  is_a: association
  input_label: HAS_PSEUDOBULK
  source: sample
  target: pseudobulk expression

pseudobulk to gene:
  represented_as: edge
  is_a: association
  input_label: PSEUDOBULK_OF_GENE
  source: pseudobulk expression
  target: gene

pseudobulk to cell type:
  represented_as: edge
  is_a: association
  input_label: PSEUDOBULK_OF_CELL_TYPE
  source: pseudobulk expression
  target: cell type

# sample participation in a cell set — counts/fractions are ASSOCIATION properties
sample to cell set:
  represented_as: edge
  is_a: association
  input_label: CONTRIBUTES_TO
  source: sample
  target: cell set
  properties:
    contributed_cell_count: int
    fraction_of_sample_cells: float

# cell-type annotation carries ontology-mapping provenance as edge properties
cell set to cell type:
  represented_as: edge
  is_a: association
  input_label: ANNOTATED_AS_CELL_TYPE
  source: cell set
  target: cell type
  properties:
    source_value: str
    ontology_mapping_status: str

cell set to cell state:
  represented_as: edge
  is_a: association
  input_label: HAS_CELL_STATE
  source: cell set
  target: cell state

# cell-type marker gene; score is not carried (plain edge)
cell type to gene:
  represented_as: edge
  is_a: association
  input_label: MARKER_GENE
  source: cell type
  target: gene

# ─────────────── Reference & provenance layer ───────────────
# Disease: stable ontology-backed concept (MONDO/NCIt) that a Diagnosis record
# points to — enables cross-dataset disease queries. ProcessedDataOutput: an
# external file/matrix pointer (checksum, format, path) shared by observations and
# generated by an assay; unifies bulk file_id + single-cell matrix provenance.

disease:
  represented_as: node
  is_a: entity
  preferred_id: disease_id              # MONDO / NCIt / DOID
  input_label: Disease
  # props: disease_name, ontology_source

processed data output:
  represented_as: node
  is_a: entity
  preferred_id: output_id
  input_label: ProcessedDataOutput
  # props: file_format, file_path, checksum, matrix_shape

diagnosis to disease:
  represented_as: edge
  is_a: association
  input_label: OF_DISEASE
  source: diagnosis
  target: disease

assay to output:
  represented_as: edge
  is_a: association
  input_label: GENERATED_OUTPUT
  source: assay
  target: processed data output

# observation -> external output it was materialised from (polymorphic source)
observation to output:
  represented_as: edge
  is_a: association
  input_label: FROM_OUTPUT
  source: [expression, methylation, variant call, protein expression]
  target: processed data output
